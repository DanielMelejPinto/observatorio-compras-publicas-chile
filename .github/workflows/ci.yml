name: DataOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test_pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Instalar dependencias para pruebas
      run: |
        python -m pip install --upgrade pip
        pip install flake8 apache-airflow dbt-postgres requests pandas sqlalchemy python-dotenv

    - name: 1. Prueba de sintaxis Python (Flake8)
      run: |
        # Detiene la ejecucion si hay errores de sintaxis o nombres indefinidos
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: 2. Prueba de integridad del DAG de Airflow
      run: |
        # Valida que el DAG cargue en memoria con 0 errores de importacion
        python -c "from airflow.models import DagBag; bag = DagBag(dag_folder='dags/', include_examples=False); assert len(bag.import_errors) == 0, f'Errores detectados en el DAG: {bag.import_errors}'; print('DAG validado exitosamente sin errores de importacion')"

    - name: 3. Prueba de parseo y sintaxis de dbt
      run: |
        # Valida que los modelos y esquemas YAML de dbt sean coherentes
        cd transformacion
        dbt parse --profiles-dir .